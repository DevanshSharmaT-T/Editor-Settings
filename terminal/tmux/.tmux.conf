# Enable mouse mode (scrolling, clicking, resizing)
set -g mouse on

# Fix PageUp and PageDown to enter scroll mode automatically
bind -n Pageup copy-mode -u

# Optional: Use Vi-style keys in copy mode (makes searching easier)
setw -g mode-keys vi

# A handy toggle: Press Prefix + m to turn mouse on/off 
# (Useful when you want to select text with your actual mouse)
bind m set -g mouse

# 1. Enable clipboard integration
set -s set-clipboard on

# 2. Add the tmux-yank plugin (Highly recommended for X11/Ubuntu)
set -g @plugin 'tmux-plugins/tmux-yank'

# 3. Ensure your Vi-mode keys actually use the system clipboard
# This allows 'y' in copy-mode to hit the X11 clipboard
set -g @yank_selection_mouse 'clipboard'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore on tmux start
set -g @continuum-restore 'on'

# Auto-install tpm and all declared plugins on first run
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
