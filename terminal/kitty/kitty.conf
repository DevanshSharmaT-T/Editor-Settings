# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
# include ./kitty-themes/00-Default.conf
include ./kitty-themes/Obsidian.conf

include current-font.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 3

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 20000
wheel_scroll_min_lines 2

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

foreground #dddddd
background #000000
cursor #dddddd

allow_remote_control yes
listen_on unix:/tmp/mykitty

# Open new tab in the current working directory
map ctrl+shift+t new_tab_with_cwd

# Open new window in the current working directory
map ctrl+shift+enter launch --cwd=current --type=window

# --- Custom Scroll Mappings ---

# Map PgUp and PgDn to scroll the terminal buffer
map page_up scroll_page_up
map page_down scroll_page_down

# Optional: Map Shift + PgUp/PgDn for faster scrolling (half page)
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
